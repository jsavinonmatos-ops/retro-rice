# mono-rice · picom (compositor: blur, sombras, esquinas redondeadas)
backend = "glx";
vsync = true;
use-damage = true;

# --- esquinas ---
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

# --- sombras ---
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.55;
shadow-offset-x = -20;
shadow-offset-y = -14;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- blur (efecto cristal) ---
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- transparencias ---
inactive-opacity = 0.92;
frame-opacity = 1.0;
opacity-rule = [
  "88:class_g = 'kitty'",
  "92:class_g = 'Thunar'",
  "95:class_g = 'Rofi'"
];

# --- animaciones suaves (fade) ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

wintypes:
{
  tooltip       = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock          = { shadow = false; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.97; };
  dropdown_menu = { opacity = 0.97; };
};

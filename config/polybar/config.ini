; mono-rice · polybar (negro + acento)

[colors]
; los valores por defecto son los del modo 'solid'; launch.sh los cambia según `mono-bar` (pills | glass | solid)
bg      = ${env:POLYBAR_BG:#cc000000}
pill    = ${env:POLYBAR_PILL:#00000000}
border  = ${env:POLYBAR_BORDER:#55fafafa}
bg-alt  = #26ffffff
fg      = #ffffff
dim     = #8c8c8c
accent  = #fafafa
alert   = #fafafa

[bar/main]
width = 100%:-32
height = 40
offset-x = 16
offset-y = 10
radius = 14
fixed-center = true
bottom = false
border-size = 1
border-color = ${colors.border}

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 0
padding-right = 0
module-margin = 0

font-0 = Inter:weight=medium:size=10;3
font-1 = JetBrainsMono Nerd Font:size=11;3

modules-left = lc1 launcher terminal browser files rc1 sp1 lc2 xworkspaces rc2
modules-center = lc3 date rc3
modules-right = lc4 music wall pulseaudio cpu memory network bluetooth battery rc4 sp4 lc5 tray power rc5

cursor-click = pointer
enable-ipc = true
wm-restack = generic
override-redirect = false

; barra para la sesión i3 (workspaces reales de i3)
[bar/i3]
inherit = bar/main
height = 34
offset-y = 8
radius = 12
modules-left = lc1 launcher terminal browser files rc1 sp1 lc2 i3 rc2
wm-restack = i3

[module/power]
type = custom/text
content-background = ${colors.pill}
content = 
content-foreground = ${colors.accent}
content-padding = 2
click-left = mono-power

[module/music]
type = custom/script
format-background = ${colors.pill}
format-padding = 3
exec = mono-music
interval = 2
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous
scroll-up = playerctl next
scroll-down = playerctl previous
label = %output%

[module/bluetooth]
type = custom/text
content-background = ${colors.pill}
content = 
content-foreground = ${colors.accent}
content-padding = 2
click-left = mono-bluetooth

[module/launcher]
type = custom/text
content-background = ${colors.pill}
content = 
content-foreground = ${colors.accent}
content-padding = 2
click-left = rofi -show drun

[module/terminal]
type = custom/text
content-background = ${colors.pill}
content = 
content-foreground = ${colors.accent}
content-padding = 2
click-left = kitty

[module/browser]
type = custom/text
content-background = ${colors.pill}
content = 
content-foreground = ${colors.accent}
content-padding = 2
click-left = mono-browser

[module/files]
type = custom/text
content-background = ${colors.pill}
content = 
content-foreground = ${colors.accent}
content-padding = 2
click-left = thunar

[module/wall]
type = custom/text
content-background = ${colors.pill}
content = 
content-foreground = ${colors.accent}
content-padding = 2
click-left = mono-wall

[module/xworkspaces]
type = internal/xworkspaces
label-occupied-background = ${colors.pill}
label-empty-background = ${colors.pill}
label-urgent-background = ${colors.pill}
label-active = %name%
label-active-background = #444444
label-active-foreground = #ffffff
label-active-padding = 3
label-occupied = %name%
label-occupied-padding = 3
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 3
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 3

[module/i3]
type = internal/i3
label-unfocused-background = ${colors.pill}
label-visible-background = ${colors.pill}
label-urgent-background = ${colors.pill}
pin-workspaces = false
show-urgent = true
index-sort = true
enable-click = true
label-mode = %mode%
label-mode-padding = 3
label-mode-background = ${colors.accent}
label-mode-foreground = #000000
label-focused = %index%
label-focused-background = #444444
label-focused-foreground = #ffffff
label-focused-padding = 3
label-unfocused = %index%
label-unfocused-padding = 3
label-visible = %index%
label-visible-padding = 3
label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 3

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.dim}
label-padding = 3

[module/date]
type = internal/date
format-background = ${colors.pill}
format-padding = 3
interval = 1
date = %a %d %b
time = %H:%M
label = %{A1:mono-cal:}%{F#fafafa}%{F-}   %time%  ·  %date%%{A}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-background = ${colors.pill}
format-muted-background = ${colors.pill}
format-volume-padding = 3
format-muted-padding = 3
use-ui-max = false
format-volume = <ramp-volume>   <label-volume>
label-volume = %percentage%%
label-muted = %{F#fafafa}%{F-}   mute
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.accent}

[module/cpu]
type = internal/cpu
format-background = ${colors.pill}
format-prefix-background = ${colors.pill}
format-padding = 3
interval = 2
format-prefix = "   "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
format-background = ${colors.pill}
format-prefix-background = ${colors.pill}
format-padding = 3
interval = 3
format-prefix = "   "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/network]
type = internal/network
format-connected-background = ${colors.pill}
format-disconnected-background = ${colors.pill}
format-connected-padding = 3
format-disconnected-padding = 3
interface-type = wireless
interval = 3
format-connected = %{A1:mono-wifi:}%{F#fafafa}%{F-}   <label-connected>%{A}
label-connected = %essid%
label-disconnected = %{A1:mono-wifi:}%{F#fafafa}%{F-}   off%{A}
label-disconnected-foreground = ${colors.dim}

[module/battery]
type = internal/battery
format-charging-background = ${colors.pill}
format-charging-padding = 3
format-discharging-background = ${colors.pill}
format-discharging-padding = 3
format-full-background = ${colors.pill}
format-full-padding = 3
format-low-background = ${colors.pill}
format-low-padding = 3
battery = ${env:POLYBAR_BAT:BAT0}
adapter = ${env:POLYBAR_AC:AC}
full-at = 99
low-at = 15
format-low = %{F#ff5370}<ramp-capacity>   <label-low>%{F-}
label-low = %percentage%%
format-charging = %{F#fafafa}%{F-}   <label-charging>
format-discharging = <ramp-capacity>   <label-discharging>
format-full = %{F#fafafa}%{F-}   <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.accent}

[module/tray]
type = internal/tray
tray-background = ${colors.pill}
tray-padding = 3
tray-spacing = 8
tray-size = 60%


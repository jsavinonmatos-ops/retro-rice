; mono-rice · polybar (negro + acento)

[colors]
bg      = #cc000000
bg-alt  = #26ffffff
fg      = #ffffff
dim     = #8c8c8c
accent  = #fafafa
alert   = #fafafa

[bar/main]
width = 100%:-32
height = 40
offset-x = 16
offset-y = 10
radius = 14
fixed-center = true
bottom = false
border-size = 1
border-color = #55fafafa

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 3
padding-right = 3
module-margin = 2

font-0 = Inter:weight=medium:size=10;3
font-1 = JetBrainsMono Nerd Font:size=11;3

modules-left = launcher terminal browser files xworkspaces xwindow
modules-center = date
modules-right = music wall pulseaudio cpu memory network bluetooth battery tray power

cursor-click = pointer
enable-ipc = true
wm-restack = generic
override-redirect = false

; barra para la sesión i3 (workspaces reales de i3)
[bar/i3]
inherit = bar/main
height = 34
offset-y = 8
radius = 12
modules-left = launcher terminal browser files i3 xwindow
wm-restack = i3

[module/power]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = mono-power

[module/music]
type = custom/script
exec = mono-music
interval = 2
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous
scroll-up = playerctl next
scroll-down = playerctl previous
label = %output%

[module/bluetooth]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = mono-bluetooth

[module/launcher]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = rofi -show drun

[module/terminal]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = kitty

[module/browser]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = mono-browser

[module/files]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = thunar

[module/wall]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = mono-wall

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = #000000
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2

[module/i3]
type = internal/i3
pin-workspaces = false
show-urgent = true
index-sort = true
enable-click = true
label-mode = %mode%
label-mode-padding = 2
label-mode-background = ${colors.accent}
label-mode-foreground = #000000
label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = #000000
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2
label-visible = %index%
label-visible-padding = 2
label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.dim}
label-padding = 2

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %{A1:mono-cal:}%{F#fafafa}%{F-}   %time%  ·  %date%%{A}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume>   <label-volume>
label-volume = %percentage%%
label-muted = %{F#fafafa}%{F-}   mute
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.accent}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "   "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "   "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:mono-wifi:}%{F#fafafa}%{F-}   <label-connected>%{A}
label-connected = %essid%
label-disconnected = %{A1:mono-wifi:}%{F#fafafa}%{F-}   off%{A}
label-disconnected-foreground = ${colors.dim}

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BAT:BAT0}
adapter = ${env:POLYBAR_AC:AC}
full-at = 99
low-at = 15
format-low = %{F#ff5370}<ramp-capacity>   <label-low>%{F-}
label-low = %percentage%%
format-charging = %{F#fafafa}%{F-}   <label-charging>
format-discharging = <ramp-capacity>   <label-discharging>
format-full = %{F#fafafa}%{F-}   <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.accent}

[module/tray]
type = internal/tray
tray-spacing = 8
tray-size = 60%

[settings]
screenchange-reload = true
pseudo-transparency = false

; mono-rice · polybar (negro + acento)

[colors]
bg      = #cc000000
bg-alt  = #26ffffff
fg      = #ffffff
dim     = #8c8c8c
accent  = #ff3d71
alert   = #ff3d71

[bar/main]
width = 100%:-32
height = 38
offset-x = 16
offset-y = 10
radius = 14
fixed-center = true
bottom = false
border-size = 1
border-color = #55ff3d71

background = ${colors.bg}
foreground = ${colors.fg}

padding-left = 3
padding-right = 3
module-margin = 3

font-0 = Inter:weight=medium:size=10;3
font-1 = JetBrainsMono Nerd Font:size=12;3

modules-left = launcher terminal browser files xworkspaces xwindow
modules-center = date
modules-right = wall pulseaudio cpu memory network battery tray

cursor-click = pointer
enable-ipc = true
wm-restack = generic
override-redirect = false

[module/launcher]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = rofi -show drun

[module/terminal]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = kitty

[module/browser]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = mono-browser

[module/files]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = thunar

[module/wall]
type = custom/text
content = 
content-foreground = ${colors.accent}
content-padding = 1
click-left = mono-wall

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = #000000
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.dim}
label-padding = 2

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %{F#ff3d71}%{F-}   %time%  ·  %date%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume>   <label-volume>
label-volume = %percentage%%
label-muted = %{F#ff3d71}%{F-}   mute
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.accent}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "   "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "   "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{F#ff3d71}%{F-}   <label-connected>
label-connected = %essid%
label-disconnected = %{F#ff3d71}%{F-}   off
label-disconnected-foreground = ${colors.dim}

[module/battery]
type = internal/battery
battery = ${env:POLYBAR_BAT:BAT0}
adapter = ${env:POLYBAR_AC:AC}
full-at = 99
format-charging = %{F#ff3d71}%{F-}   <label-charging>
format-discharging = <ramp-capacity>   <label-discharging>
format-full = %{F#ff3d71}%{F-}   <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.accent}

[module/tray]
type = internal/tray
tray-spacing = 8
tray-size = 60%

[settings]
screenchange-reload = true
pseudo-transparency = false

; retro-rice · barra mínima de emergencia: se usa sola si config.ini tiene errores o polybar no arranca con ella.
[colors]
bg = #cc000000
fg = #ffffff
dim = #8c8c8c
accent = #fafafa

[bar/main]
width = 100%:-32
height = 40
offset-x = 16
offset-y = 10
radius = 14
fixed-center = true
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 3
padding-right = 3
module-margin = 2
font-0 = Inter:weight=medium:size=10;3
modules-left = xworkspaces
modules-center = date
modules-right = tray
enable-ipc = true

[bar/i3]
inherit = bar/main
modules-left = i3
wm-restack = i3

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = #000000
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 2

[module/i3]
type = internal/i3
pin-workspaces = false
index-sort = true
label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = #000000
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2
label-visible = %index%
label-visible-padding = 2
label-urgent = %index%
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %time%  ·  %date%

[module/tray]
type = internal/tray
tray-spacing = 8
tray-size = 60%

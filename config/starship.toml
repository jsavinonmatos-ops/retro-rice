# mono-rice · starship (negro + acento)
add_newline = true
format = "$directory$git_branch$git_status$cmd_duration\n$character"

[directory]
style = "bold #7aa2ff"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = " [ $branch]($style)"
style = "#c792ea"

[git_status]
format = "[ $all_status$ahead_behind]($style)"
style = "#ffcb6b"

[cmd_duration]
min_time = 2000
format = " [took $duration]($style)"
style = "#666666"

[character]
success_symbol = "[❯](bold #4be3a0)"
error_symbol = "[❯](bold #ff3d71)"
